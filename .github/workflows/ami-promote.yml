name: Promote runner AMI

on:
  workflow_call:
    inputs:
      architecture:
        description: Architecture channel to update
        required: true
        type: string
      build_run_id:
        description: Build workflow run ID
        required: true
        type: string
      build_run_attempt:
        description: Build workflow run attempt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture channel to update
        required: true
        type: choice
        options:
          - amd64
          - arm64
      build_run_id:
        description: Build workflow run ID
        required: true
        type: string
      build_run_attempt:
        description: Build workflow run attempt
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read # Required to resolve the exact build run attempt.

env:
  AWS_REGION: us-east-1

jobs:
  promote:
    name: Promote ${{ inputs.architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: runner-ami-production-${{ inputs.architecture }}
    concurrency:
      group: runner-ami-channel-${{ inputs.architecture }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Required to resolve the exact build run attempt.
      id-token: write # Required for AWS OIDC role assumption.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Read exact build attempt revision
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build run ID must be a positive integer" >&2
            exit 2
          }
          [[ "$BUILD_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build run attempt must be a positive integer" >&2
            exit 2
          }
          attempt_file="$(mktemp)"
          trap 'rm -f "$attempt_file"' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/attempts/${BUILD_RUN_ATTEMPT}" \
            > "$attempt_file"
          source_revision="$(jq -er '.head_sha' "$attempt_file")"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ inputs.architecture == 'amd64' && vars.AMI_PROMOTION_ROLE_AMD64_ARN || vars.AMI_PROMOTION_ROLE_ARM64_ARN }}
          role-session-name: ami-promote-${{ inputs.architecture }}
          mask-aws-account-id: true

      - name: Promote validated candidate
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          SOURCE_REVISION: ${{ steps.attempt.outputs.source_revision }}
        run: |
          deployments/shared-runners/scripts/ami-channel.sh promote \
            --build-run-id "$BUILD_RUN_ID" \
            --build-run-attempt "$BUILD_RUN_ATTEMPT" \
            --source-revision "$SOURCE_REVISION"
