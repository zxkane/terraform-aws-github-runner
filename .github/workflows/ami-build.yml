name: Build and validate runner AMI

on:
  workflow_call:
    inputs:
      architecture:
        description: Runner AMI architecture
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PACKER_VERSION: 1.16.0
  PACKER_LINUX_AMD64_SHA256: 5edcd14ab59b535040c512dbecd6ec9ef976a000b073c19d93e4c431c948581e
  SESSION_MANAGER_PLUGIN_VERSION: 1.2.835.0
  SESSION_MANAGER_PLUGIN_SHA256: 7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03

jobs:
  build:
    name: Build and validate ${{ inputs.architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCHITECTURE: ${{ inputs.architecture }}
      RELEASE_ID: ${{ format('{0}.{1}', github.run_id, github.run_attempt) }}
      SOURCE_REVISION: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC role assumption.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AMI_BUILD_ROLE_ARN }}
          role-session-name: ami-build-${{ inputs.architecture }}
          mask-aws-account-id: true

      - name: Install Packer and Session Manager plugin
        run: |
          set -euo pipefail
          packer_zip="$RUNNER_TEMP/packer.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip" \
            --output "$packer_zip"
          printf '%s  %s\n' "$PACKER_LINUX_AMD64_SHA256" "$packer_zip" | sha256sum --check --status
          sudo unzip -q "$packer_zip" -d /usr/local/bin

          session_manager_deb="$RUNNER_TEMP/session-manager-plugin.deb"
          curl --fail --silent --show-error --location --retry 3 \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/${SESSION_MANAGER_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb" \
            --output "$session_manager_deb"
          printf '%s  %s\n' "$SESSION_MANAGER_PLUGIN_SHA256" "$session_manager_deb" |
            sha256sum --check --status
          sudo dpkg --install "$session_manager_deb"
          packer version
          session-manager-plugin --version

      - name: Build candidate AMI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
          AMI_BUILDER_INSTANCE_PROFILE: ${{ vars.AMI_BUILDER_INSTANCE_PROFILE }}
          AMI_BUILDER_SECURITY_GROUP_ID: ${{ vars.AMI_BUILDER_SECURITY_GROUP_ID }}
          AMI_SUBNET_ID: ${{ vars.AMI_SUBNET_ID }}
          AMI_SOURCE_OWNER_ID: ${{ vars.AMI_SOURCE_OWNER_ID }}
          AMI_ID_OUTPUT_FILE: ${{ runner.temp }}/candidate-ami-id
        run: deployments/shared-runners/scripts/build-release-ami.sh

      - name: Validate final AMI
        env:
          AMI_ID_FILE: ${{ runner.temp }}/candidate-ami-id
          AMI_VALIDATOR_INSTANCE_PROFILE: ${{ vars.AMI_VALIDATOR_INSTANCE_PROFILE }}
          AMI_VALIDATOR_SECURITY_GROUP_ID: ${{ vars.AMI_VALIDATOR_SECURITY_GROUP_ID }}
          AMI_SUBNET_ID: ${{ vars.AMI_SUBNET_ID }}
          VALIDATOR_INSTANCE_ID_FILE: ${{ runner.temp }}/validator-instance-id
          VALIDATOR_LAUNCH_MARKER_FILE: ${{ runner.temp }}/validator-launch-attempted
        run: deployments/shared-runners/scripts/validate-release-ami.sh

      - name: Ensure Packer builder instances are terminated
        if: always()
        run: deployments/shared-runners/scripts/cleanup-release-builders.sh

      - name: Ensure validator instance is terminated
        if: always()
        env:
          VALIDATOR_INSTANCE_ID_FILE: ${{ runner.temp }}/validator-instance-id
          VALIDATOR_LAUNCH_MARKER_FILE: ${{ runner.temp }}/validator-launch-attempted
        run: deployments/shared-runners/scripts/cleanup-release-validators.sh

  promote:
    name: Promote ${{ inputs.architecture }}
    needs: build
    if: >-
      (inputs.architecture == 'amd64' && vars.AMI_AUTO_PROMOTE_AMD64 == 'true') ||
      (inputs.architecture == 'arm64' && vars.AMI_AUTO_PROMOTE_ARM64 == 'true')
    permissions:
      contents: read
      actions: read # Required to resolve the exact build run attempt.
      id-token: write # Required for AWS OIDC role assumption.
    uses: ./.github/workflows/ami-promote.yml
    with:
      architecture: ${{ inputs.architecture }}
      build_run_id: ${{ github.run_id }}
      build_run_attempt: ${{ github.run_attempt }}
