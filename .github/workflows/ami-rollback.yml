name: Roll back runner AMI

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture channel to roll back
        required: true
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  rollback:
    name: Roll back ${{ inputs.architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: runner-ami-production-${{ inputs.architecture }}
    concurrency:
      group: runner-ami-channel-${{ inputs.architecture }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC role assumption.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ inputs.architecture == 'amd64' && vars.AMI_PROMOTION_ROLE_AMD64_ARN || vars.AMI_PROMOTION_ROLE_ARM64_ARN }}
          role-session-name: ami-rollback-${{ inputs.architecture }}
          mask-aws-account-id: true

      - name: Restore previous image
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: deployments/shared-runners/scripts/ami-channel.sh rollback
